<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document Assistant</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main class="chat-shell">
      <header class="chat-header">
        <div class="brand-mark" aria-hidden="true">✦</div>
        <div>
          <h1>Document Assistant</h1>
          <p>Ask questions about your indexed documents.</p>
        </div>
        <label class="upload-button" for="document-file">
          <span aria-hidden="true">↑</span> Upload PDF
        </label>
        <input id="document-file" type="file" accept="application/pdf,.pdf" hidden />
      </header>
      <p id="upload-status" class="upload-status" role="status"></p>

      <section id="messages" class="messages" aria-live="polite">
        <article class="message assistant-message">
          <div class="avatar" aria-hidden="true">AI</div>
          <p>Hi! What would you like to know?</p>
        </article>
      </section>

      <form id="chat-form" class="chat-form">
        <label class="sr-only" for="question">Your question</label>
        <textarea
          id="question"
          name="question"
          rows="1"
          maxlength="2000"
          placeholder="Ask a question..."
          required
        ></textarea>
        <button id="send-button" type="submit">
          <span>Send</span><span aria-hidden="true">↑</span>
        </button>
      </form>
      <p class="hint">Press Enter to send · Shift + Enter for a new line</p>
    </main>
    <script src="/app.js"></script>
  </body>
</html>
